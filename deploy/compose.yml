# Production on the server: the game behind Caddy (automatic HTTPS). This file lives root-owned in
# /etc/crateball/compose.yml on the server (scripts/install-deploy.sh puts it there); releases only build
# the image crateball:latest (deploy/remote-deploy.sh), they cannot change this file.
# Limits are sized for the global caps (100 rooms, 600 players) with plenty of headroom.
name: crateball
services:
  game:
    image: crateball:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '8080'
      APP_VERSION: ${APP_VERSION:-unknown}
      # Empty on the server; only the local stack smoke test allows its https://localhost Origin.
      CRATEBALL_ORIGINS: ${CRATEBALL_ORIGINS:-}
      # Server caps (empty = the defaults in packages/server/src/config.ts, set from the load test). To
      # change them without a release: put CRATEBALL_MAX_PLAYERS=… in /etc/crateball/.env (root) and
      # recreate the game container.
      CRATEBALL_MAX_ROOMS: ${CRATEBALL_MAX_ROOMS:-}
      CRATEBALL_MAX_PLAYERS: ${CRATEBALL_MAX_PLAYERS:-}
      CRATEBALL_MAX_SOCKETS: ${CRATEBALL_MAX_SOCKETS:-}
      # Game processes (empty = 3 in production; see packages/server/src/cluster.ts).
      CRATEBALL_WORKERS: ${CRATEBALL_WORKERS:-}
      # Caddy reaches the game through this socket (no container network per message); TCP 8080 stays
      # for health checks and as Caddy's fallback.
      CRATEBALL_SOCKET: /run/crateball/game.sock
    volumes:
      - game_sock:/run/crateball
    expose: ['8080']
    read_only: true
    tmpfs: ['/tmp:size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 2g
    pids_limit: 256
    # Logs go to the server's journal so they survive redeploys (journald caps the total size).
    # Read them with: journalctl -o cat CONTAINER_TAG=crateball-game
    logging:
      # journald on the server; the local stack smoke uses json-file (Docker Desktop has no journald).
      driver: ${CRATEBALL_LOG_DRIVER:-journald}
      options: { tag: crateball-game }
  caddy:
    # Pinned by digest (refresh: docker buildx imagetools inspect caddy:2, then install-deploy.sh).
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    # The CRATEBALL_* variables are only set by the local stack smoke test (scripts/docker-smoke.sh
    # stack); on the server they are unset and these are the real ports and site.
    ports:
      - '${CRATEBALL_HTTP_PORT:-80}:80'
      - '${CRATEBALL_HTTPS_PORT:-443}:443'
      - '${CRATEBALL_HTTPS_PORT:-443}:443/udp'
    environment:
      CRATEBALL_SITE: ${CRATEBALL_SITE:-playcrateball.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - game_sock:/run/crateball
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: ['/tmp:size=16m']
    # Binding 80/443 inside the container needs this one; everything else is dropped.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  caddy_data:
  caddy_config:
  game_sock:
