<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Crateball</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #1b2347;
        color: #fff4e0;
        font:
          600 16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 44px;
        color: #ffb760;
      }
      p {
        margin: 0 0 18px;
        opacity: 0.8;
      }
      button {
        font:
          700 16px system-ui,
          sans-serif;
        padding: 8px 22px;
        border: 0;
        border-radius: 12px;
        background: #ffb760;
        color: #3a1a06;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Crateball</h1>
      <p>
        Can't reach the game server. Crateball needs an internet connection.<br />Trying again every few
        seconds.
      </p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      const target = new URLSearchParams(location.search).get('url') || 'https://playcrateball.com/';
      const go = () => location.replace(target);
      document.getElementById('retry').addEventListener('click', go);
      setInterval(() => navigator.onLine && go(), 8000);
    </script>
  </body>
</html>
