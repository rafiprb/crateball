[package]
name = "crateball"
version = "0.2.0"
description = "Crateball desktop build (Steam): a window onto playcrateball.com"
authors = ["RafiBuilds"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
# Steam stats and achievements (links the Steam API library, shipped next to the binary).
steamworks = "0.13"

# Windows: the .crateball file type is registered per user on start (Steam installs no installer).
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Small binary: the app only opens a window.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
