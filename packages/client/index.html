<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crateball</title>
    <meta
      name="description"
      content="3v3 arcade football in your browser. Crates drop guns, mines and ice. Create a room, share the link, play."
    />
    <meta name="theme-color" content="#141A33" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable from Chrome/Edge: the installed app opens double-clicked .crateball replay files. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Link previews (X shows a "summary" card: image on the left, title and description on the right) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crateball" />
    <meta property="og:url" content="https://playcrateball.com/" />
    <meta property="og:title" content="Crateball — 3v3 arcade football" />
    <meta
      property="og:description"
      content="3v3 arcade football with crates that drop guns, mines and ice. Free, in the browser, no install."
    />
    <meta property="og:image" content="https://playcrateball.com/og.png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />
    <meta property="og:image:alt" content="A wooden crate and a football" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Crateball — 3v3 arcade football" />
    <meta
      name="twitter:description"
      content="3v3 arcade football with crates that drop guns, mines and ice. Free, in the browser, no install."
    />
    <meta name="twitter:image" content="https://playcrateball.com/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Splash: inline so it paints before the script and stylesheet arrive (main.ts removes it). -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0d1330;
        transition: opacity 0.35s ease;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash svg {
        width: 112px;
        height: 112px;
        animation: splash-bob 1.1s ease-in-out infinite alternate;
      }
      #splash .dots {
        display: flex;
        gap: 8px;
      }
      #splash .dots i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff9a3d;
        animation: splash-dot 0.9s ease-in-out infinite;
      }
      #splash .dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      #splash .dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes splash-bob {
        to {
          transform: translateY(-6px);
        }
      }
      @keyframes splash-dot {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg,
        #splash .dots i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Loading Crateball" role="status">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="9" y="17" width="30" height="30" rx="3" fill="#C88A4A" stroke="#7A4E22" stroke-width="3" />
        <path d="M9 17 39 47M39 17 9 47" stroke="#7A4E22" stroke-width="3" />
        <circle cx="43" cy="38" r="13" fill="#FFFFFF" stroke="#1B2133" stroke-width="3" />
        <path d="M43 31.5l5.5 4-2 6.5h-7l-2-6.5z" fill="#1B2133" />
        <path
          d="M43 25v6.5M48.5 35.5l6-1.5M46.5 42l3.5 5.5M39.5 42 36 47.5M37.5 35.5l-6-1.5"
          stroke="#1B2133"
          stroke-width="2"
        />
      </svg>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="banner" hidden></div>
    <div id="maintenance" class="screen" role="status" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="9" y="17" width="30" height="30" rx="3" fill="#C88A4A" stroke="#7A4E22" stroke-width="3" />
        <path d="M9 17 39 47M39 17 9 47" stroke="#7A4E22" stroke-width="3" />
        <circle cx="43" cy="38" r="13" fill="#FFFFFF" stroke="#1B2133" stroke-width="3" />
        <path d="M43 31.5l5.5 4-2 6.5h-7l-2-6.5z" fill="#1B2133" />
        <path
          d="M43 25v6.5M48.5 35.5l6-1.5M46.5 42l3.5 5.5M39.5 42 36 47.5M37.5 35.5l-6-1.5"
          stroke="#1B2133"
          stroke-width="2"
        />
      </svg>
      <h1>Down for maintenance</h1>
      <p>We're working on the server. Crateball will be back in a few minutes.</p>
      <p class="small">No need to refresh, this screen goes away by itself.</p>
    </div>
    <div id="full" class="screen" role="status" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="9" y="17" width="30" height="30" rx="3" fill="#C88A4A" stroke="#7A4E22" stroke-width="3" />
        <path d="M9 17 39 47M39 17 9 47" stroke="#7A4E22" stroke-width="3" />
        <circle cx="43" cy="38" r="13" fill="#FFFFFF" stroke="#1B2133" stroke-width="3" />
        <path d="M43 31.5l5.5 4-2 6.5h-7l-2-6.5z" fill="#1B2133" />
        <path
          d="M43 25v6.5M48.5 35.5l6-1.5M46.5 42l3.5 5.5M39.5 42 36 47.5M37.5 35.5l-6-1.5"
          stroke="#1B2133"
          stroke-width="2"
        />
      </svg>
      <h1>Servers are full</h1>
      <p>Lots of people are playing right now. Trying again in <span id="full-wait">15</span> s.</p>
      <div class="row">
        <button type="button" id="full-retry" class="primary">Try now</button>
        <button type="button" id="full-back">Back</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
